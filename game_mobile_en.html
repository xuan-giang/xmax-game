<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SPA Xmas Game</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap');

    :root {
      --popup-max-w-desktop: 520px;
      --popup-max-w-mobile: 360px;

      --overlay-bg: transparent;

      --close-size: 34px;
      --close-bg: #d62b2b;
      --close-border: #ffffff;

      --text-dark: #3a2b2b;
      --text-light: #ffffff;

      --btn-radius: 999px;
      --btn-pad-y: 12px;
      --btn-pad-x: 18px;

      --input-radius: 12px;
      --input-h: 44px;

      --shadow: 0 18px 55px rgba(0, 0, 0, .35);
    }

    /* ========= Page wrapper (demo) ========= */
    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #f6f6f6;
      color: var(--text-dark);
    }

    /* ========= Sticky (Màn 1) ========= */
    .spa-sticky {
      position: fixed;
      right: 12px;
      bottom: 18px;
      width: 8%;
      height: auto;
      cursor: pointer;
      z-index: 9999;
      user-select: none;
    }

    .spa-sticky img {
      width: 80%;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, .25));
    }

    .spa-sticky[hidden] {
      display: none !important;
    }

    /* ========= Modal shell ========= */
    .spa-modal {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 10000;
    }

    .spa-modal.is-open {
      display: flex;
    }

    .spa-popup {
      position: relative;
      display: inline-block;
      width: auto;
      max-width: 92vw;
      border-radius: 0;
      overflow: visible;
      /* box-shadow: var(--shadow); */
      transform: translateY(6px);
      animation: popIn .18s ease-out forwards;
      background: transparent;
    }

    @keyframes popIn {
      to {
        transform: translateY(0);
      }
    }

    /* Base image (popup-base.png) */
    .spa-popup__base {
      width: auto;
      max-width: 100%;
      display: block;
      height: auto;
    }

    /* Close button (CSS) */
    .spa-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: var(--close-size);
      height: var(--close-size);
      border-radius: 999px;
      background: var(--close-bg);
      border: 2px solid var(--close-border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 2px;
      cursor: pointer;
      z-index: 5;
    }

    .spa-close::before,
    .spa-close::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
    }

    .spa-close::before {
      transform: rotate(45deg);
    }

    .spa-close::after {
      transform: rotate(-45deg);
    }

    /* ========= Content overlay area ========= */
    .spa-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .spa-content * {
      pointer-events: auto;
    }

    /* ===== Layout anchors (percent-based) =====
   Tweak these 4 vars if you need pixel-perfect matching after swapping real assets.
*/
    .layout-form {
      position: absolute;
      left: 50%;
      top: 64%;
      transform: translate(-50%, -50%);
      width: min(640px, 62%);
      text-align: center;
    }

    .layout-result {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      width: min(700px, 72%);
      text-align: center;
    }

    .spa-title {
      text-align: center;
      font-weight: 900;
      letter-spacing: .2px;
      line-height: 1.05;
      margin: 0;
      font-size: 42px;
      color: #9b001e;
      text-shadow: none;
      text-transform: uppercase;
    }


    .spa-subtitle {
      margin-top: 10px;
      font-size: 13.52px;
      color: #7a6666;
      font-weight: 600;
      line-height: 1.35;
    }

    .spa-icons {
      display: flex;
      justify-content: center;
      padding-top: 2px;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .spa-icons img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .22));
    }

    /* Form area */
    .spa-form {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .spa-field {
      width: 72%;
      margin: 0 auto;
      text-align: left;
    }

    .spa-label {
      font-size: 13.52px;
      font-weight: 600;
      color: #6b5a5a;
      margin: 0 0 6px 4px;
    }

    .spa-input {
      width: 96%;
      height: var(--input-h);
      border-radius: var(--input-radius);
      border: 1px solid rgba(0, 0, 0, .06);
      padding: 0 14px;
      font-size: 13px;
      outline: none;
      background: rgba(216, 193, 175, .65);
    }

    .spa-input:focus {
      border-color: rgba(0, 0, 0, .22);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, .25);
    }

    .spa-check {
      width: 72%;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13.52px;
      color: #5a4a4a;
      text-shadow: none;
    }

    .spa-check input {
      width: 14px;
      height: 14px;
      margin-top: 2px;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      accent-color: #d62b2b;
    }

    .spa-btn {
      border: 0;
      border-radius: var(--btn-radius);
      padding: var(--btn-pad-y) var(--btn-pad-x);
      font-weight: 800;
      cursor: pointer;
      width: 48%;

      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .spa-btn--primary {
      font-size: 24px;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #9b001e;
      color: #ffffff;
      box-shadow: 0 10px 18px rgba(0, 0, 0, .18);
    }

    .spa-btn--primary:active {
      transform: translateY(1px);
    }

    

    /* Loading state for OPEN GIFT button */
    .spa-btn.is-loading {
      pointer-events: none;
      opacity: .9;
    }

    .spa-btn .btn-spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      vertical-align: -2px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 999px;
      animation: spaSpin .9s linear infinite;
    }

    @keyframes spaSpin {
      to { transform: rotate(360deg); }
    }

.spa-error {
      width: 72%;
      font-size: 12px;
      color: #ffe7e7;
      background: rgba(214, 43, 43, .55);
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 12px;
      padding: 8px 10px;
      display: none;
    }

    .spa-error.is-show {
      display: block;
    }

    /* ========= Result screen ========= */
    .spa-intro {
      text-align: center;
      font-size: 28px;
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: auto;
      color: #A3001C;
      text-shadow: none;
      margin-top: 24% !important;
      white-space: pre-line;
    }

    /* Tablet */
    @media (max-width: 768px) {
      .spa-intro {
        font-size: 24px;
      }
    }



    .spa-result-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 10px;
    }

    .spa-result-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      flex: 0 0 auto;
    }


    .spa-result-icon img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .25));
    }

    .spa-result-frame {
      position: relative;
      flex: 0 0 auto;
      width: clamp(180px, 30vw, 260px);
      margin: 0;
    }

    .spa-result-frame img {
      width: 100%;
      display: block;
      height: auto;
    }

    .spa-result-frame .spa-frame-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 2px;
      gap: 4px;
      text-align: center;
      font-weight: 900;
      color: #1a1a1a;
    }

    .spa-frame-text .t1 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: .6px;
      color: #FFD154;
    }

    .spa-frame-text .t2 {
      font-size: 60px;
      line-height: 1;
      color: #ffffff;
    }

    .spa-frame-text .t3 {
      font-size: 16px;
      letter-spacing: .6px;
      color: #ffffff;
    }

    .spa-note {
      width: 72%;
      margin: 6px auto 0;
      text-align: center;
      font-size: 12px;
      line-height: 1.35;
      color: #7a6666;
      text-shadow: none;
      white-space: pre-line;
    }

    .spa-code-row {
      width: 32%;
      margin: 6px auto 0;
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .spa-code {
      flex: 1;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, .06);
      background: rgba(216, 193, 175, .65);
      padding: 0 12px;
      height: 44px;
      display: flex;
      align-items: center;
      font-weight: 800;
      letter-spacing: .4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .spa-copy {
      width: 54px;
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, .08);
      background: rgba(216, 193, 175, .65);
      font-weight: 900;
      cursor: pointer;
      background-image: url("https://kituhay.com/assets/images/copy-icon.svg");
      background-repeat: no-repeat;
      background-position: center;
    }

    .spa-btn--secondary {
      background: #9b001e;
      color: #ffffff;
      box-shadow: 0 10px 18px rgba(0, 0, 0, .18);
    }


    .req {
      color: #d62b2b;
      font-weight: 900;
    }

    .terms-link {
      color: #1b1b1b;
      font-weight: 900;
      text-decoration: none;
      /* no underline */
      cursor: pointer;
    }

    .spa-toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, .82);
      color: #fff;
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      display: none;
      z-index: 20000;
    }

    .spa-toast.is-show {
      display: block;
    }

    /* ========= Screen switching ========= */
    .screen {
      display: none;
    }

    .screen.is-active {
      display: block;
    }

    /* ========= Device variants ========= */
    body.device-desktop {
      --popup-w: var(--popup-max-w-desktop);
    }

    body.device-mobile {
      --popup-w: var(--popup-max-w-mobile);
    }

    /* Make overlay positions stable across aspect ratios (percent-based) */
    /* You can tweak these values later if needed after swapping real assets */
    .layout-form .spa-title {
      text-align: center;
      font-weight: 900;
      letter-spacing: .2px;
      line-height: 1.05;
      margin: 0;
      font-size: 42px;
      color: #9b001e;
      text-shadow: none;
      text-transform: uppercase;
    }

    .layout-form .spa-form {
      margin-top: 10px;
    }

    .layout-result .spa-intro {
      margin-top: 40px;
    }

    .layout-result .spa-result-icon img {
      width: 98px;
      height: 98px;
    }

    #btnLearnMore {
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      width: 40%;
      margin-top: 2%;
    }

    @media (max-width: 1024px) {
      .layout-result {
        top: 55%;
      }
    }

    @media (max-width: 768px) {
      .layout-result {
        top: 66%;
      }
    }

    @media (max-width: 576px) {
      .spa-sticky {
        right: 1%;
        bottom: 2%;
        width: clamp(72px, 24vw, 110px);
        /* mobile nhỏ -> tự co, màn lớn -> không quá to */
      }

      .spa-sticky img {
        width: 80%;
      }

      .layout-form {
        width: 76%;
        top: 80%;
      }

      .layout-result {
        width: 80%;
        top: 72%;
      }

      .layout-form .spa-title {
        font-size: 14px;
        font-weight: 700;
      }

      .spa-input {
        width: 80%;
        height: 16px;
        padding: 0 12px;
        font-size: 10px;
        border-radius: 10px;
      }

      .spa-check {
        font-size: 6.52px;
        gap: 0px;
        align-items: flex-start;
      }

      .spa-form {
        gap: 3px;
      }

      .spa-check input {
        width: 10px;
        height: 10px;
        margin-top: 2px;
        font-family: 'Be Vietnam Pro', system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        accent-color: #d62b2b;
      }

      .spa-subtitle {
        font-size: 6px;
        line-height: 0.35;
      }

      .spa-icons img {
        width: 24px;
        height: 24px;
      }

      .spa-intro {
        font-size: 12px;
      }

      .layout-result .spa-result-icon img {
        width: 45px;
        height: 45px;
      }

      .spa-result-frame {
        width: 36%;
      }

      .spa-frame-text .t1 {
        font-size: 10px;
      }

      .spa-frame-text .t2 {
        font-size: 16px;
      }

      .spa-frame-text .t3 {
        font-size: 10px;
      }

      .spa-note {
        font-size: 8px;
        line-height: 1;
      }

      .spa-code-row {
        width: 64%;
      }

      #btnLearnMore {
        width: 56%;
        margin-top: 5%;
      }
    }

    @media (max-width: 420px) {

      .layout-form {
        width: 76%;
        top: 75%;
      }

      /* Result row: stack on very small screens */
      .spa-result-row {
        gap: 8px;
      }

      .spa-result-frame {
        width: 36%;
      }

      .spa-btn--primary {
        font-size: 10px;
        line-height: 2px;
      }

    }

    @media (max-width: 420px) {
      .layout-result {
        width: 96%;
        top: 74%;
      }
    }
  </style>

<body class="device-desktop">
  <!-- ===== Sticky (Màn 1) ===== -->
  <div class="spa-sticky" id="spaSticky" aria-label="Open Xmas game">
    <img id="stickyImg" alt="Sticky" />
  </div>

  <!-- ===== Modal + Popup ===== -->
  <div class="spa-modal" id="spaModal" aria-hidden="true">
    <div class="spa-popup" role="dialog" aria-modal="true" aria-label="Xmas game popup">
      <div class="spa-close" id="spaClose" aria-label="Close"></div>

      <img class="spa-popup__base" id="popupBaseImg" alt="Popup base" />

      <!-- Overlay content -->
      <div class="spa-content" id="spaContent">
        <!-- Màn 2: Form -->
        <div class="screen layout-form" id="screenForm">
          <div class="spa-title" id="formTitle"></div>

          <div class="spa-icons" id="formIcons"></div>

          <div class="spa-subtitle" id="formSubtitle"></div>

          <div class="spa-error" id="formError"></div>

          <form class="spa-form" id="leadForm" autocomplete="on">
            <div class="spa-field">
              <input class="spa-input" id="inpName" type="text" name="name" required />
            </div>

            <div class="spa-field">
              <input class="spa-input" id="inpEmail" type="email" name="email" required />
            </div>

            <label class="spa-check">
              <input id="inpAgree" type="checkbox" />
              <span id="agreeText"></span>
            </label>

            <button class="spa-btn spa-btn--primary" type="submit" id="btnOpenGift"></button>
          </form>
        </div>

        <!-- Màn 3: Result -->
        <div class="screen layout-result" id="screenResult">
          <div class="spa-intro" id="resultIntro"></div>

          <div class="spa-result-row">
            <div class="spa-result-icon">
              <img id="resultIcon" alt="Result icon" />
            </div>

            <div class="spa-result-frame">
              <img id="resultFrameImg" alt="Result frame" />
              <div class="spa-frame-text">
                <div class="t1" id="frameT1"></div>
                <div class="t2"><span id="framePercent">--</span>%*</div>
                <div class="t3" id="frameT3"></div>
              </div>
            </div>
          </div>

          <div class="spa-note" id="resultNote"></div>

          <div class="spa-code-row">
            <div class="spa-code" id="uniqueCode" style="text-align: center;">------</div>
            <button class="spa-copy" type="button" id="btnCopy"></button>
          </div>

          <button class="spa-btn spa-btn--secondary" type="button" id="btnLearnMore"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="spa-toast" id="spaToast">Copied</div>

    /**
     * ===========================
     * Build-time injected

     */
    const BUILD = {

    /**
     * ===========================
     * Utilities
     * ===========================
     */
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
    const randPick = arr => arr[Math.floor(Math.random() * arr.length)];

    function showToast(text) {
      const t = $('#spaToast');
      t.textContent = text;
      t.classList.add('is-show');
      setTimeout(() => t.classList.remove('is-show'), 1500);
    }

    function setScreen(screenId) {
      ['screenForm', 'screenResult'].forEach(id => $('#' + id).classList.remove('is-active'));
      $('#' + screenId).classList.add('is-active');
    }

    function openModal() {
      $('#spaModal').classList.add('is-open');
      $('#spaModal').setAttribute('aria-hidden', 'false');
    }
    function closeModal() {
      $('#spaModal').classList.remove('is-open');
      $('#spaModal').setAttribute('aria-hidden', 'true');
    }

    function validEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/i.test(String(email || '').trim());
    }

    function setError(msg) {
      const box = $('#formError');
      if (!msg) {
        box.classList.remove('is-show');
        box.textContent = '';
        return;
      }
      box.textContent = msg;
      box.classList.add('is-show');
      //alert(msg)
    }

    /**
     * ===========================
     * CleverTap helpers (safe)
     * ===========================
     */
    function hasCleverTap() {
      return typeof window.clevertap === 'object' && window.clevertap;
    }

    function ctOnUserLogin(profile) {
      try {
        if (hasCleverTap() && window.clevertap.onUserLogin && typeof window.clevertap.onUserLogin.push === 'function') {
          window.clevertap.onUserLogin.push(profile);
        } else {
          console.log('[CT] onUserLogin.push', profile);
        }
      } catch (e) { console.warn('onUserLogin.push error', e); }
    }

    // Close / dismiss when this HTML is rendered inside a CleverTap Web Pop-up iframe.
    // Ref: https://developer.clevertap.com/docs/web-popup#web-pop-ups
    function ctDismissWebPopup() {
      try {
        var pd = (window.parent && window.parent.document) ? window.parent.document : null;
        if (!pd) return false;

        // Interstitial overlay + wrapper
        var overlay = pd.getElementById('intentOpacityDiv');
        var wrapperInterstitial = pd.getElementById('intentPreview');

        // Box / Banner wrappers (IDs depend on template)
        var wrapperBox0 = pd.getElementById('wizParDiv0');
        var wrapperBox2 = pd.getElementById('wizParDiv2');

        var removed = false;

        if (overlay && typeof overlay.remove === 'function') { overlay.remove(); removed = true; }
        if (wrapperInterstitial && typeof wrapperInterstitial.remove === 'function') { wrapperInterstitial.remove(); removed = true; }
        if (wrapperBox0 && typeof wrapperBox0.remove === 'function') { wrapperBox0.remove(); removed = true; }
        if (wrapperBox2 && typeof wrapperBox2.remove === 'function') { wrapperBox2.remove(); removed = true; }

        return removed;
      } catch (e) { return false; }
    }

    function ctEventPush(evtName, payload) {
      try {
        if (hasCleverTap() && typeof window.clevertap.event?.push === 'function') {
          window.clevertap.event.push(evtName, payload);
        } else {
          console.log('[CT] event.push', evtName, payload);
        }
      } catch (e) { console.warn('event.push error', e); }
    }

    // ===== Coupon fetch via CleverTap Vouchers API (GET) =====
    const CT_VOUCHER_API = {
      endpoint: 'https://ct-voucher-proxy.ngxuangiang2020.workers.dev/api/vouchers',
      accountId: '',
      passcode: '',
      timeoutMs: 9000
    };

    function ctAbortableFetch(url, options = {}, timeoutMs = 9000) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);
      return fetch(url, { ...options, signal: controller.signal })
        .finally(() => clearTimeout(t));
    }

    function ctExtractPercentFromText(text) {
      const s = String(text || '');
      const m = s.match(/(\d{1,2})\s*%/);
      if (!m) return null;
      const n = Number(m[1]);
      return Number.isFinite(n) ? n : null;
    }

    function ctPickNearestPercent(n) {
      const allowed = [50, 20, 10, 8, 5];
      if (!Number.isFinite(n)) return 20;
      let best = allowed[0];
      let bestDist = Math.abs(n - best);
      for (const p of allowed.slice(1)) {
        const d = Math.abs(n - p);
        if (d < bestDist) { best = p; bestDist = d; }
      }
      return best;
    }

    function ctVoucherRecordToCoupon(record) {
      const code = String(record?.voucherCode || '').trim();
      const pctRaw =
        ctExtractPercentFromText(record?.listName) ??
        ctExtractPercentFromText(record?.listDescription) ??
        ctExtractPercentFromText(record?.metadata?.name) ??
        null;

      const pct = ctPickNearestPercent(pctRaw);
      return {
        name: `voucher-${pct}`,   // keep compatible with COUPON_NAME_TO_RESULT_KEY
        code,
        raw: record
      };
    }

    async function ctCouponFetchViaApi(identity) {
      const id = String(identity || '').trim();
      if (!id) throw new Error('Missing identity');

      const url = `${CT_VOUCHER_API.endpoint}?identity=${encodeURIComponent(id)}`;

      let res;

      try {
        res = await ctAbortableFetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        }, CT_VOUCHER_API.timeoutMs);
      } catch (e) {
        // Common in browsers: CORS blocks cross-origin calls -> fetch throws TypeError("Failed to fetch")
        throw new Error(`Voucher API request failed: ${e?.message || e}`);
      }

      if (!res.ok) {
        const body = await res.text().catch(() => '');
        throw new Error(`Voucher API HTTP ${res.status}: ${body || res.statusText}`);
      }

      const data = await res.json().catch(() => null);
      if (!data || data.status !== 'success') {
        throw new Error(`Voucher API invalid response: ${JSON.stringify(data)}`);
      }

      const records = Array.isArray(data.records) ? data.records : [];
      if (!records.length) {
        throw new Error('Voucher API: no voucher records returned (out of codes / not eligible)');
      }

      // If multiple vouchers exist, pick 1 at random for a "mở quà" feel.
      const picked = records[Math.floor(Math.random() * records.length)];
      const coupon = ctVoucherRecordToCoupon(picked);

      if (!coupon.code) {
        throw new Error('Voucher API: missing voucherCode in record');
      }

      return coupon;
    }

    // Optional fallback: Web SDK coupon.fetch (kept clean + no double-call)
    function ctCouponFetchWithRetryLegacy(promoNames, maxRetry) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        const tried = new Set();

        const doTry = () => {
          attempts++;
          const remaining = promoNames.filter(n => !tried.has(n));
          const promo = (remaining.length ? randPick(remaining) : randPick(promoNames));
          tried.add(promo);

          const fetchFn = hasCleverTap() && window.clevertap.coupon && typeof window.clevertap.coupon.fetch === 'function'
            ? window.clevertap.coupon.fetch
            : null;

          const onSuccess = (coupon) => resolve(coupon);
          const onFail = (err) => {
            if (attempts >= maxRetry) return reject(err || new Error('fetch failed'));
            doTry();
          };

          if (!fetchFn) return onFail(new Error('clevertap.coupon.fetch not available'));

          try {
            fetchFn(promo, onSuccess, onFail);
          } catch (e) {
            onFail(e);
          }
        };

        doTry();
      });
    }

    async function getCouponForUser(identity) {
      try {
        return await ctCouponFetchViaApi(identity);
      } catch (apiErr) {
        console.warn('[CT][API] voucher GET failed:', apiErr);
        throw apiErr;
      }
    }

    /**
     * ===========================
     * Render result
     * ===========================
     */
    function renderResult(coupon) {
      const couponName = String(coupon?.name || '').trim();
      const resultKey = COMMON_CONFIG.COUPON_NAME_TO_RESULT_KEY[couponName] || couponName;

      const pct = COMMON_CONFIG.RESULT_PERCENT[resultKey] ?? 0;
      const iconFile = COMMON_CONFIG.RESULT_ICONS[resultKey] || COMMON_CONFIG.RESULT_ICONS['PROMO_20'];

      $('#resultIcon').src = iconFile;
      $('#framePercent').textContent = String(pct || '--');

      const code = String(coupon?.code || '').trim() || '------';
      $('#uniqueCode').textContent = code;

      // Learn more link placeholder/random
      const link = randPick(COMMON_CONFIG.CTA_LINKS) || '#';
      $('#btnLearnMore').onclick = () => { window.location.href = link; };

      // Tracking
      ctEventPush('Xmas_Game_Played', {
        coupon_name: couponName,
        result_key: resultKey,
        percent: pct,
        code: code
      });

      if (COMMON_CONFIG.ENABLE_ONE_PLAY_LOCK) {
        try { localStorage.setItem(COMMON_CONFIG.ONE_PLAY_KEY, JSON.stringify({ at: Date.now(), couponName, code, resultKey, pct })); } catch (e) { }
      }

      setScreen('screenResult');
    }

     * Init
     * ===========================
     */

      const lang = (BUILD.LANG === 'en') ? 'en' : 'vi';
      const t = I18N[lang];

      // assets
      $('#stickyImg').src = COMMON_CONFIG.STICKY_IMAGE;
      $('#popupBaseImg').src = COMMON_CONFIG.POPUP_BASE;
      $('#resultFrameImg').src = COMMON_CONFIG.RESULT_FRAME;

      $('#formTitle').textContent = t.formTitle;
      $('#inpName').placeholder = t.namePh;
      $('#inpEmail').placeholder = t.emailPh;
      $('#agreeText').innerHTML = `${t.agreePrefix}<a href="#" class="terms-link" id="termsLink">${t.agreeTerms}</a>${t.agreeSuffix}<span class="req">*</span>`;
      $('#btnOpenGift').textContent = t.openGift;
      $('#formSubtitle').textContent = t.formSubtitle;

      // result texts
      $('#resultIntro').textContent = t.intro;
      $('#frameT1').textContent = t.frameT1;
      $('#frameT3').textContent = t.frameT3;
      $('#resultNote').textContent = t.note;
      $('#btnCopy').textContent = '';
      $('#btnLearnMore').textContent = t.learnMore;

      // form icons (Màn 2)
      const iconsWrap = $('#formIcons');
      COMMON_CONFIG.FORM_ICONS.forEach((f, idx) => {
        const img = document.createElement('img');
        img.alt = 'Icon ' + (idx + 1);
        img.src = f;
        iconsWrap.appendChild(img);
      });

      // open/close
      $('#spaSticky').addEventListener('click', () => {
        setError('');
        // Optional: one-play lock behavior
        if (COMMON_CONFIG.ENABLE_ONE_PLAY_LOCK) {
          try {
            const saved = localStorage.getItem(COMMON_CONFIG.ONE_PLAY_KEY);
            if (saved) {
              const data = JSON.parse(saved);
              // re-render
              renderResult({ name: data.couponName, code: data.code });
              openModal();
              return;
            }
          } catch (e) { }
        }
        setScreen('screenForm');
        openModal();
      });

      $('#spaClose').addEventListener('click', () => {
        // If running inside CleverTap Web Pop-up iframe, remove CleverTap overlay/wrapper
        if (ctDismissWebPopup()) return;

        closeModal();
        if (COMMON_CONFIG.HIDE_STICKY_ON_CLOSE) {
          $('#spaSticky').hidden = true;
        }
      });

      // submit
      $('#leadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        setError('');

        const name = String($('#inpName').value || '').trim();
        const email = String($('#inpEmail').value || '').trim();
        const agree = $('#inpAgree').checked;

        if (!name || !email) {
          setError(t.errRequired);
          return;
        }
        if (!validEmail(email)) {
          setError(t.errEmail);
          return;
        }
        if (!agree) {
          setError(t.errAgree);
          return;
        }

        // Identify user (onUserLogin)
        ctOnUserLogin({ Site: { Name: name, Identity: email, Email: email } });

        // Coupon fetch
        const btn = $('#btnOpenGift');
        btn.disabled = true;
        btn.classList.add('is-loading');
        btn.innerHTML = `<span class="btn-spinner" aria-hidden="true"></span><span>${t.loadingCode}</span>`;

        try {
          await new Promise(r => setTimeout(r, 5000));
          const coupon = await getCouponForUser(email);
          renderResult(coupon);
        } catch (err) {
          console.warn(err);
          showToast(t.errFetch);
          showToast("Không thể lấy mã ưu đãi");
        } finally {
          btn.classList.remove('is-loading');
          btn.disabled = false;
          btn.textContent = t.openGift;
        }
      });

      // copy
      $('#btnCopy').addEventListener('click', async () => {
        const code = $('#uniqueCode').textContent.trim();
        if (!code || code === '------') return;
        try {
          await navigator.clipboard.writeText(code);
          showToast(t.copied);
        } catch (e) {
          // fallback
          const ta = document.createElement('textarea');
          ta.value = code;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          showToast(t.copied);
        }
        ctEventPush('Xmas_Game_Played', { code });
      });

      // initial screen
      setScreen('screenForm');
    })();
  </script>
